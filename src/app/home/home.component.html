<div class="home-container">
  <div class="hero-section">
    <h1>Bienvenue sur Events Manager</h1>
    <p>Découvrez et gérez vos événements en toute simplicité</p>
    <button class="btn btn-primary" (click)="onCreateEvent()" *ngIf="roleService.canCreateEvent()">Créer un événement</button>
  </div>

  <div class="content-section">
    <div class="filters-bar">
      <input 
        type="text" 
        class="search-input" 
        placeholder="Rechercher un événement..."
        (input)="onSearchChange($any($event.target).value)" />

      <div class="categories-chips">
        <button 
          class="chip"
          [class.active]="selectedCategories.length === 0"
          (click)="clearAllCategories()">
          Toutes les catégories
        </button>
        <button 
          class="chip"
          *ngFor="let c of categories"
          [class.active]="isCategorySelected(c.id!)"
          (click)="toggleCategory(c.id! + '')">
          <span class="chip-label">{{ c.name }}</span>
          <span class="chip-remove" *ngIf="isCategorySelected(c.id!)" (click)="removeCategory(c.id! + '', $event)">✕</span>
        </button>
      </div>
    </div>
    <div *ngIf="isLoading" class="loading">
      <p>Chargement des événements...</p>
    </div>

    <div *ngIf="!isLoading">
      <section class="events-section">
        <h2>Événements passés</h2>
        <div class="events-grid" *ngIf="filteredPast.length > 0; else noPastEvents">
          <app-event-card 
            *ngFor="let event of filteredPast"
            [event]="event"
            [showActions]="true"
            [categories]="categories"
            (eventSelected)="onEventSelected($event)"
            (eventDeleted)="onEventDeleted($event)"
            (eventEdited)="onEventEdited($event)"
            (eventUpdated)="onEventUpdated($event)">
          </app-event-card>
        </div>
        <ng-template #noPastEvents>
          <p class="no-events">Aucun événement passé pour le moment.</p>
        </ng-template>
      </section>

      <section class="events-section">
        <h2>Événements à venir</h2>
        <div class="events-grid" *ngIf="filteredUpcoming.length > 0; else noUpcomingEvents">
          <app-event-card 
            *ngFor="let event of filteredUpcoming"
            [event]="event"
            [showActions]="true"
            [categories]="categories"
            (eventSelected)="onEventSelected($event)"
            (eventDeleted)="onEventDeleted($event)"
            (eventEdited)="onEventEdited($event)"
            (eventUpdated)="onEventUpdated($event)">
          </app-event-card>
        </div>
        <ng-template #noUpcomingEvents>
          <p class="no-events">Aucun événement à venir pour le moment.</p>
        </ng-template>
      </section>
    </div>
  </div>
</div>
